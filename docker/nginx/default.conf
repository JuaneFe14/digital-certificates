# =============================================================================
# Nginx Configuration - TLS + Reverse Proxy
# =============================================================================
# Configuracion de Nginx para:
#   1. Escuchar en puerto 443 con HTTPS (TLS 1.2+)
#   2. Terminacion TLS (descifrar trafico entrante)
#   3. Reverse proxy a FastAPI en red interna
#   4. Headers de seguridad HTTP estrictos
# =============================================================================

server {
    # Escuchar en puerto 443 con SSL y HTTP/2
    listen 443 ssl http2;
    server_name localhost;

    # =========================================================================
    # TLS Configuration (Alta Seguridad)
    # =========================================================================
    # Ruta a los certificados generados por OpenSSL
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Protocolos TLS permitidos (1.0 y 1.1 tienen vulnerabilidades)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cipher suites seguros (ECDHE = Forward Secrecy, AES-GCM = autenticado)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # Cache de sesiones TLS (reutilizar claves temporales)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Deshabilitar session tickets (mas seguro)
    ssl_session_tickets off;

    # OCSP Stapling (deshabilitado para certificados auto-firmados)
    ssl_stapling off;
    ssl_stapling_verify off;

    # =========================================================================
    # Security Headers
    # =========================================================================
    # HSTS: Forzar HTTPS por 2 anos en el navegador
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevenir MIME-sniffing (ejecutar archivos como scripts)
    add_header X-Content-Type-Options "nosniff" always;

    # Prevenir clickjacking (carga en iframe)
    add_header X-Frame-Options "DENY" always;

    # Proteccion contra XSS en navegadores antiguos
    add_header X-XSS-Protection "1; mode=block" always;

    # Controlar informacion de referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy: solo cargar recursos del mismo dominio
    # (CSS y JS de CDN para Swagger UI)
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;" always;

    # =========================================================================
    # Reverse Proxy to FastAPI
    # =========================================================================
    # Todas las peticiones se redirigen a FastAPI en la red Docker
    location / {
        proxy_pass http://fastapi:8000;

        # Headers para que FastAPI conozca el origen real de la peticion
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts para evitar conexiones colgadas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================================================
    # Health Check Endpoint (interno de Nginx)
    # =========================================================================
    # Endpoint local para health check de Docker, sin proxy
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
